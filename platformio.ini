; PlatformIO project: netradio (Reveil-CYDGOLD port) for ES3C28P
; Board: LCDWiki ES3C28P, ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM)
; Source: https://github.com/cyrilrudler-create/Reveil-CYDGOLD
; HW ref (pins/audio/touch): ../xiaozhi-esp32/main/boards/lcdwiki-es3c28p (config.h)
;   ILI9341 240x320 SPI + FT6336 touch + ES8311 codec. Pinout identical to upstream
;   CYD-GOLD config (see src/config.h for es3c28p adaptations).

[env:es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; --- 16MB flash + 8MB OPI PSRAM (N16R8) ---
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions_16MB_cyd.csv
board_build.filesystem = littlefs

; --- USB CDC (native USB-C, serial + upload) ---
monitor_speed = 115200
monitor_port = /dev/ttyACM0
upload_port = /dev/ttyACM0
upload_speed = 921600

build_flags =
  -I include
  -I src
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  ; --- Compile-time WiFi seed (used once when no network is stored) ---
  ; Copy this to your own values locally, do NOT commit real credentials.
  -DWIFI_SEED_SSID='"YourSSID"'
  -DWIFI_SEED_PASS='"YourPassword"'
  ; --- LVGL 8 config ---
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  ; --- TFT_eSPI driver setup via build flags (no User_Setup.h file) ---
  -DUSER_SETUP_LOADED
  -DILI9341_DRIVER
  -DUSE_FSPI_PORT
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=46
  -DTFT_RST=-1
  -DTFT_MISO=13
  -DTFT_BL=45
  -DTFT_BACKLIGHT_ON=HIGH
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD
  -DLOAD_FONT
  -DLOAD_GFXFF
  -DSMOOTH_FONT

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@8.3.11
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.4.6
  adafruit/RTClib@^2.1.4
  bblanchon/ArduinoJson@^7.4.3
